[workspace]
name = "rnagym-3d"
description = "RNAGym 3D structure benchmark environment"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
biopython = "1.*"
curl = "8.*"
gemmi = "0.*"
go-shfmt = "==3.13.1"
hhsuite = "3.*"
hmmer = "3.*"
infernal = "1.*"
matplotlib = "3.*"
numpy = "1.*"
pandas = "2.*"
fastparquet = "*"
mmseqs2 = "==15.6f452"
polars = "1.*"
python = "3.11.*"
requests = "2.*"
ruff = "==0.15.21"
scikit-learn = "1.*"
scipy = "1.*"
setuptools = "<81"
shellcheck = "==0.11.0"
taplo = "==0.10.0"
tqdm = "4.*"
usalign = "==2024.07.30"

[pypi-dependencies]
evcouplings = { git = "https://github.com/debbiemarkslab/EVcouplings.git", rev = "14c83457c6cfca8156aabe0615067447a2169791" }
rna-normalizer = { git = "https://github.com/RNA-Puzzles/RNA_assessment.git", rev = "d46f0472e7d52629283bb046a9c8f5d36b35f685" }
rna3db = { git = "https://github.com/marcellszi/rna3db.git", rev = "a58c1557d43104bb290781eb2d4c8d4f9538baf8" }
rnagym = { path = "../..", editable = true }

[tasks]
fmt = "bash sh/format.sh"
lint = "bash sh/lint.sh"
pipeline = "python -m rnagym.s3d.gym"
merge = "python -m rnagym.s3d.gym merge"
annotate = "python -m rnagym.s3d.gym annotate"
split = "python -m rnagym.s3d.gym split"
evcouplings = "python -m rnagym.s3d.gym evcouplings"
analyze = "python -m rnagym.s3d.gym analyze"
leaderboard = "python -m rnagym.s3d.tasks.score"
af3 = "bash sh/af3.sh"
rna-assessment-source = "bash sh/fetch-source.sh rna-assessment"
score = { cmd = "python -m rnagym.s3d.tasks.score_predictions", depends-on = [
  "rna-assessment-source",
] }
export = "python -m rnagym.s3d.gym export"
# TODO(MCA): Replace this installer once Riboseek is available through Bioconda
install-riboseek = "bash sh/fetch-riboseek.sh"
riboseek-db = { cmd = "bash sh/riboseek-db.sh", depends-on = [
  "install-riboseek",
] }
riboseek = { cmd = "bash sh/riboseek.sh", depends-on = ["install-riboseek"] }
usalign = "bash sh/usalign.sh"
predict = "python -m rnagym.s3d.jobs.predict"

[feature.model.dependencies]
git = "2.*"

[feature.model.pypi-dependencies]
rnagym = { path = "../..", editable = true }

[feature.af3.dependencies]
c-compiler = "1.*"
cmake = ">=3.28"
hmmer = "3.*"
ninja = "1.*"
pip = "*"
pybind11 = "*"
python = "3.11.*"
scikit-build-core = "*"

[feature.af3.pypi-dependencies]
absl-py = "*"
chex = "==0.1.90"
dm-haiku = "==0.0.13"
dm-tree = "*"
jax = { version = "==0.4.34", extras = ["cuda12"] }
jax-triton = "==0.2.0"
jaxtyping = "==0.2.34"
numpy = "==1.26.4"
rdkit = "==2024.3.5"
triton = "==3.1.0"
tqdm = "*"
typeguard = "==2.13.3"
zstandard = "*"

[feature.af3.tasks]
source = "bash sh/fetch-source.sh"
build = { cmd = "bash sh/build-af3.sh", depends-on = ["source"] }

[environments]
default = { solve-group = "default" }
af3 = { features = ["model", "af3"], no-default-feature = true }
