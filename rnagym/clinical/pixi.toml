[workspace]
name = "rnagym-clinical"
description = "RNAGym clinical variant benchmark environment"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

# Staging, merging, evaluation and the leaderboard run here, on the versions
# that made the published evaluation. Scoring runs in the fitness model
# environments (sh/score.sh).
[dependencies]
cpuonly = { version = "*", channel = "pytorch" }
go-shfmt = "==3.13.1"
numpy = "==1.26.4"
polars = "==1.44.1"
pytest = "==8.4.2"
python = "3.11.*"
pytorch = { version = "2.*", channel = "pytorch" }
ruff = "==0.15.21"
scikit-learn = "==1.9.0"
shellcheck = "==0.11.0"
taplo = "==0.10.0"
tqdm = "==4.69.0"
typing_extensions = ">=4.6"

[pypi-dependencies]
pyrefly = "==1.2.0"
rnagym = { path = "../..", editable = true }

[tasks]
evaluate = "python -m rnagym.clinical.tasks.evaluate"
fmt = "bash sh/format.sh"
leaderboard = "python -m rnagym.clinical.tasks.leaderboard"
lint = "bash sh/lint.sh"
merge = "python -m rnagym.clinical.tasks.merge"
prepare = "python -m rnagym.clinical.tasks.prepare"
score = "bash sh/score.sh"
test = "python -m pytest -q ../../tests/test_clinical.py"
