[workspace]
name = "rnagym-fitness"
description = "RNAGym fitness benchmark environment"
channels = ["pytorch", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
cpuonly = { version = "*", channel = "pytorch" }
go-shfmt = "==3.13.1"
numpy = "2.*"
pandas = "2.*"
pytest = "==8.4.2"
pytest-cov = "==7.0.0"
python = "3.11.*"
pytorch = { version = "2.*", channel = "pytorch" }
ruff = "==0.15.21"
scikit-learn = "1.*"
scipy = "1.*"
shellcheck = "==0.11.0"
taplo = "==0.10.0"
tqdm = "==4.69.0"

[pypi-dependencies]
rnagym = { path = "..", editable = true }

[tasks]
coverage = "bash sh/coverage.sh"
fmt = "bash sh/format.sh"
lint = "bash sh/lint.sh"
test = "cd .. && python -m pytest -q tests/test_fitness.py"

# TODO(MCA): Add isolated environments for each fitness model adapter
